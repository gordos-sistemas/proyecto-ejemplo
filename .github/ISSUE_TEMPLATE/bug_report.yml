
name: "Reporte de error"
description: "Informar un problema en el proyecto"
title: "[BUG] "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar un problema.
        No incluyas credenciales ni información sensible.

  - type: textarea
    id: description
    attributes:
      label: "Descripción del error"
      description: "Explicá qué está fallando."
      placeholder: "El problema ocurre cuando..."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: "Pasos para reproducirlo"
      placeholder: |
        1. Abrir...
        2. Hacer clic en...
        3. Observar...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Comportamiento esperado"
      description: "¿Qué debería suceder?"
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: "Capturas o registros"
      description: "Adjuntá evidencia sin datos sensibles."
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: "Verificaciones"
      options:
        - label: "Busqué Issues similares antes de crear este."
          required: true
        - label: "Verifiqué que no incluí datos sensibles."
          required: true
